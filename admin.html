<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pak Highland Tech | Admin Orders</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f6f5;
color:#17202a;
}

.header{
background:#075e54;
color:white;
text-align:center;
padding:22px 15px;
}

.header h1{
margin:0;
font-size:26px;
}

.header p{
margin:7px 0 0;
font-size:15px;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.stats{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
margin-bottom:22px;
}

.stat{
background:white;
padding:18px 8px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 10px #0001;
}

.stat b{
display:block;
font-size:25px;
margin-bottom:7px;
color:#075e54;
}

.order{
background:white;
border-radius:15px;
padding:20px;
box-shadow:0 2px 12px #0001;
}

.order-top{
display:flex;
justify-content:flex-start;
align-items:center;
gap:15px;
border-bottom:1px solid #eee;
padding-bottom:14px;
margin-bottom:18px;
}

.order-id{
font-size:18px;
font-weight:bold;
color:#075e54;
}

.status{
background:#fff3cd;
color:#856404;
padding:7px 14px;
border-radius:20px;
font-weight:bold;
font-size:13px;
}

.section{
margin-bottom:18px;
}

.section h3{
margin:0 0 9px;
font-size:17px;
color:#075e54;
}

.details{
line-height:1.9;
font-size:15px;
}

.product{
background:#f7f9f9;
padding:14px;
border-radius:10px;
line-height:1.8;
}

.total{
font-size:21px;
font-weight:bold;
color:#075e54;
margin-top:15px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:9px;
margin-top:20px;
}

button{
border:0;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.confirm{background:#d1fae5;color:#065f46}
.ship{background:#dbeafe;color:#1e40af}
.deliver{background:#dcfce7;color:#166534}
.cancel{background:#fee2e2;color:#991b1b}
.whatsapp{background:#25d366;color:white}

@media(max-width:700px){
.stats{
grid-template-columns:repeat(2,1fr);
}

.order-top{
align-items:flex-start;
gap:10px;
flex-direction:column;
}

.container{
padding:12px;
}
}
</style>
</head>

<body>

<header class="header">
<h1>PAK HIGHLAND TECH</h1>
<p>Admin Order Dashboard</p>
</header>

<div class="container">

<div class="stats">

<div class="stat">
<b id="total">1</b>
Total Orders
</div>

<div class="stat">
<b id="pending">1</b>
Pending
</div>

<div class="stat">
<b id="confirmed">0</b>
Confirmed
</div>

<div class="stat">
<b id="shipped">0</b>
Shipped
</div>

<div class="stat">
<b id="delivered">0</b>
Delivered
</div>

</div>

<div id="orders-container"></div>

<script>
const SUPABASE_URL =  "https://bjcjpmnafceabtxwmxcp.supabase.co";

const SUPABASE_KEY = "sb_publishable_9Gn0lqTp2Cb6SPHuG7SLCw_yhe56YS7";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);async function loadOrders() {
    const container = document.getElementById("orders-container");

    const { data, error } = await supabaseClient
        .from("orders")
        .select("*")
        .order("id", { ascending: false });

    if (error) {
        console.error("Orders load error:", error);
        container.innerHTML = "<p>Orders could not be loaded.</p>";
        return;
    }

    container.innerHTML = "";

    data.forEach((order) => {

        const orderBox = document.createElement("div");
        orderBox.className = "order";

        orderBox.innerHTML = `
            <div class="order-top">
                <div class="order-id">Order #${order.id}</div>
                <div class="status">${order.status || "pending"}</div>
            </div>

            <div class="section">
                <h3>Customer Details</h3>

                <div class="details">
                    <strong>Name:</strong> ${order.customer_name || ""}<br>
                    <strong>Mobile:</strong> ${order.customer_mobile || ""}<br>
                    <strong>Address:</strong> ${order.customer_address || ""}
                </div>
            </div>

            <div class="section">
                <h3>Order Details</h3>

                <div class="product">
                    <strong>Product:</strong> ${order.product_name || ""}<br>
                    <strong>Quantity:</strong> ${order.quantity || 0}<br>
                    <strong>Price:</strong> Rs. ${order.price || 0}<br>
                    <strong>Subtotal:</strong> Rs. ${order.subtotal || 0}
                </div>

                <div class="total">
                    Total: Rs. ${order.subtotal || 0}
                </div>
            </div>

            <div class="buttons">
                <button onclick="updateOrderStatus(${order.id}, 'confirmed')">
                    Confirm
                </button>

                <button onclick="updateOrderStatus(${order.id}, 'shipped')">
                    Shipped
                </button>

                <button onclick="updateOrderStatus(${order.id}, 'delivered')">
                    Delivered
                </button>

                <button onclick="updateOrderStatus(${order.id}, 'cancelled')">
                    Cancel
                </button>
            </div>
        `;

        container.appendChild(orderBox);
    });
}


async function updateOrderStatus(id, status) {

    const { error } = await supabaseClient
        .from("orders")
        .update({ status: status })
        .eq("id", id);

    if (error) {
        console.error("Status update error:", error);
        alert("Status could not be updated.");
        return;
    }

    loadOrders();
}
function setStatus(value){

document.getElementById("status").innerText=value;

document.getElementById("pending").innerText=
value==="Pending" ? 1 : 0;

document.getElementById("confirmed").innerText=
value==="Confirmed" ? 1 : 0;

document.getElementById("shipped").innerText=
value==="Shipped" ? 1 : 0;

document.getElementById("delivered").innerText=
value==="Delivered" ? 1 : 0;
localStorage.setItem("orderStatus", value);
}
const savedStatus = localStorage.getItem("orderStatus");

if(savedStatus){
    setStatus(savedStatus);
}
function openWhatsApp(){

let phone="923018317217";

let message=
"Assalam-o-Alaikum Muhammad Mubashar, "+
"regarding your Pak Highland Tech order #PHT-0001.";

window.open(
"https://wa.me/"+phone+
"?text="+encodeURIComponent(message),
"_blank"
);

}

</script>

</body>
</html>
